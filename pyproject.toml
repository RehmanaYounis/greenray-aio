[project]
name = "greenray-aio"
version = "0.3.0"
description = "GreenRay AIO: hands-on lab simulator and mock exam for the NVIDIA NCP-AIO (AI Operations) certification"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Rehmana Younis" }]
keywords = [
    "ncp-aio", "nvidia-certification", "ai-infrastructure", "ai-operations", "exam-prep",
    "slurm", "kubernetes", "gpu-operator", "base-command-manager", "dgx", "hpc", "simulator",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
    "Topic :: System :: Clustering",
    "Topic :: System :: Systems Administration",
]
dependencies = ["pyyaml>=6.0"]

[project.urls]
Homepage = "https://github.com/RehmanaYounis/greenray-aio"
Issues = "https://github.com/RehmanaYounis/greenray-aio/issues"

[project.scripts]
greenray = "greenray.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.uv.build-backend]
module-name = "greenray"

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = [
    "E501",    # long realistic command output lines are intentional
    "SIM102",  # nested ifs mirror the command-line parsing they emulate
    "SIM108",
    "E741",    # short names like `l` for NVLink ids mirror the tools' own terminology
    "B904",    # CommandError deliberately replaces the Python traceback with tool-style output
    "B905",    # zip() over equal-length parsed columns
]

[tool.ruff.lint.isort]
known-first-party = ["greenray"]
