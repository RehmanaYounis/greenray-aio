id: ins-ngc-registry-auth
code: ins-4
title: Pull a private NGC container with docker and Kubernetes
domain: Installation and Deployment
difficulty: medium
time_limit_min: 20
tags: [ngc, nvcr.io, docker, kubernetes, imagePullSecrets]
briefing: |
  The LLM team publishes its fine-tuning image to their private NGC org/team registry:

      nvcr.io/b7z2ajrtgcn5/llm-team/nemo-finetune:24.05

  The org admin generated an NGC API key for the cluster and left it in
  /root/ngc-api-key.txt on bcm-head. Nothing has been configured with it yet.

  1. Configure the NGC CLI on bcm-head (org b7z2ajrtgcn5, team llm-team) so the admins
     can browse the private registry.
  2. A data scientist wants to try the image interactively with docker on dgx-01.
     Make sure the image is pulled there.
  3. The Kubernetes pod "nemo-finetune" in namespace "llm" already references an image
     pull secret called ngc-secret but has never started. Make it run without changing
     the pod spec.
objectives:
  - NGC CLI on bcm-head is configured with the API key, org b7z2ajrtgcn5 and team llm-team
  - The private image is present in dgx-01's local docker image store
  - Secret llm/ngc-secret of type kubernetes.io/dockerconfigjson exists for nvcr.io
  - Pod llm/nemo-finetune is Running
setup:
  - python: |
      from greenray.commands import helm, kubectl as kc
      state.ngc.private_repos = {"b7z2ajrtgcn5/llm-team/nemo-finetune": ["24.05", "24.03"],
                                 "b7z2ajrtgcn5/llm-team/tokenizer-tools": ["1.2"]}
      state.ngc.valid_api_keys = ["nvapi-x7Lq2MZ9vT4pRk8sWc3NdY6hB1fJ0gKu5aVeXoQiHmPn"]
      helm.preinstall(state, "nvidia/gpu-operator", values={"driver": {"enabled": False}}, settle=86400)
      kc.ensure_namespace(state, "llm")
      kc.apply_yaml(state, """
      apiVersion: v1
      kind: Pod
      metadata:
        name: nemo-finetune
        namespace: llm
        labels: {app: nemo-finetune}
      spec:
        imagePullSecrets:
        - name: ngc-secret
        containers:
        - name: finetune
          image: nvcr.io/b7z2ajrtgcn5/llm-team/nemo-finetune:24.05
          command: ["python", "/opt/finetune/train.py", "--config", "/configs/llama3-8b-lora.yaml"]
          resources:
            limits:
              nvidia.com/gpu: 1
      """)
      kc.advance(state, 2400)
      kc.reconcile(state)
  - file: /root/ngc-api-key.txt
    host: bcm-head
    content: |
      nvapi-x7Lq2MZ9vT4pRk8sWc3NdY6hB1fJ0gKu5aVeXoQiHmPn
checks:
  - desc: NGC CLI configured with the API key, org and team
    expr: "ngc.configured and ngc.api_key == 'nvapi-x7Lq2MZ9vT4pRk8sWc3NdY6hB1fJ0gKu5aVeXoQiHmPn' and ngc.org == 'b7z2ajrtgcn5' and ngc.team == 'llm-team'"
  - desc: /root/.ngc/config written on bcm-head
    expr: "'org = b7z2ajrtgcn5' in file('bcm-head', '/root/.ngc/config')"
  - desc: private image pulled on dgx-01
    expr: "'nvcr.io/b7z2ajrtgcn5/llm-team/nemo-finetune:24.05' in nodes['dgx-01'].docker_images"
  - desc: llm/ngc-secret is a dockerconfigjson secret for nvcr.io with $oauthtoken
    expr: "any(s.name == 'ngc-secret' and s.namespace == 'llm' and s.type == 'kubernetes.io/dockerconfigjson' and 'nvcr.io' in s.data['.dockerconfigjson'] and '$oauthtoken' in s.data['.dockerconfigjson'] for s in k8s.secrets)"
  - desc: llm/nemo-finetune is Running
    expr: "any(p.name == 'nemo-finetune' and p.status == 'Running' for p in pods('llm'))"
  - desc: you looked at why the pod could not pull its image
    expr: "ran(r'kubectl (describe (pod|pods|po)|get (events|ev)).*') and ran(r'-n llm|--namespace[ =]llm')"
hints:
  - "`kubectl describe pod nemo-finetune -n llm` shows two separate problems in the Events: a missing pull secret, and a 401 from nvcr.io."
  - "For nvcr.io the username is always the literal string $oauthtoken and the password is the API key. In bash put it in single quotes ('$oauthtoken'), otherwise the shell expands it to an empty string."
  - "`ngc config set` asks for API key, output format, org, team and ace. In the lab, feed the answers with a heredoc (<<EOF ... EOF) instead of typing them interactively."
  - "docker login on dgx-01 only helps docker on dgx-01. kubelet pulls through containerd and only uses credentials from an imagePullSecret: kubectl create secret docker-registry ngc-secret --docker-server=nvcr.io --docker-username='$oauthtoken' --docker-password=<key> -n llm"
references:
  - NGC User Guide - Generating your NGC API key / Accessing the NGC container registry
  - Kubernetes docs - Pull an image from a private registry
