# Command guides for `explain <command>` in the lab.
# Rules: generic and concise; teach the tool, never the answer to a scenario.
# No hostnames from the simulated cluster, no scenario ids, no fixed values a lab expects.

nvidia-smi:
  summary: query and configure NVIDIA GPUs on the node you are logged in to
  purpose: Shows each GPU's health, utilisation, memory, power, clocks, temperature, ECC and MIG state, and changes GPU settings.
  when: First stop for any GPU symptom (slow, missing, erroring) on a specific node.
  options:
    - "(no options)            summary table of all GPUs and the processes using them"
    - "-L                      list GPUs and MIG devices with UUIDs"
    - "-q [-d SECTION] [-i N]  full report; SECTION = PERFORMANCE, POWER, TEMPERATURE, ECC, ROW_REMAPPER, MEMORY, CLOCK"
    - "--query-gpu=F1,F2 --format=csv   chosen fields as a table (see `nvidia-smi --help-query-gpu`)"
    - "-i N                    limit a query or change to one GPU (without -i, changes apply to all GPUs)"
    - "-pm 0|1, -pl WATTS, -r, -mig 0|1, mig ...   settings: persistence, power limit, reset, MIG"
    - "topo -m                 GPU / NIC / CPU affinity matrix"
  read:
    - "Clocks Event Reasons (-q -d PERFORMANCE): which limiter is active. SW = a setting; HW = hardware."
    - "'Unable to determine the device handle' or ERR! means the GPU is lost or needs a reset."
  errors:
    - "'Insufficient Permissions' / 'Not Supported': the GPU or driver model does not allow that change."
    - "'In use by another client': a process still holds the GPU."

dcgmi:
  summary: NVIDIA Data Center GPU Manager CLI (health, diagnostics, monitoring, policies)
  purpose: Talks to the DCGM host engine (nvidia-dcgm service) to run GPU diagnostics, health watches and field monitoring.
  when: To prove whether GPU hardware is healthy, before returning a node to service, or to watch GPUs over time.
  options:
    - "discovery -l            list GPUs DCGM can see"
    - "group -c NAME --default create a group with all GPUs (most commands take -g GROUP)"
    - "health -s a / -c        set health watches / check them"
    - "diag -r 1|2|3|4         diagnostics: 1 quick, 2 medium, 3 long, 4 extended (higher = more intrusive)"
    - "dmon -e FIELD_IDS       stream metrics; policy --get/--set/--reg   automatic violation handling"
    - "nvlink -s / -e -g GPU   link status per GPU and NVSwitch / error counters"
    - "topo, fieldgroup -l, profile -l   topology, field groups for dmon and stats, profiling metrics"
  read:
    - "Diag table: any test marked Fail names the GPU and the reason."
    - "Health check: Healthy / Warning / Failure per subsystem (memory, NVLink, PCIe, thermal, power)."
  errors:
    - "'Unable to connect to host engine': the nvidia-dcgm service is not running."

dmesg:
  summary: print the kernel ring buffer
  purpose: "Shows kernel messages, including NVIDIA driver errors (NVRM: Xid ...) and NIC/PCIe events."
  when: Something failed at the hardware or driver level; you want the kernel's own account.
  options:
    - "dmesg | grep -i xid     NVIDIA Xid errors (the number identifies the failure class)"
    - "dmesg -T                human-readable timestamps"
  read:
    - "Xid number and the PCI address: they tell you what failed and on which GPU."

journalctl:
  summary: read systemd logs
  purpose: Shows logs written by services (slurmd, kubelet, docker, munge, nvidia-fabricmanager ...).
  when: A service fails to start, keeps restarting, or behaves oddly.
  options:
    - "-u UNIT                 one service's log"
    - "-xeu UNIT               the end of a unit's log with explanations (after a failed start)"
    - "-k                      kernel messages, like dmesg"
  read:
    - "The first error after the most recent start attempt is usually the real cause."

systemctl:
  summary: inspect and control systemd services
  purpose: Start, stop, restart, enable or check services.
  when: To see whether a daemon is running, why it stopped, or to (re)start it after a config change.
  options:
    - "status UNIT             running? enabled at boot? last log lines"
    - "start|stop|restart UNIT"
    - "enable --now UNIT       start now and at every boot"
    - "is-active / is-enabled UNIT"
  read:
    - "Active: (running/failed/inactive) and Loaded: (...; enabled/disabled)."
  errors:
    - "'Job for X failed': read journalctl -xeu X."

sinfo:
  summary: Slurm partitions and node states
  purpose: Shows which nodes are idle, allocated, drained or down, per partition.
  when: First look at a Slurm cluster, or when jobs are not starting.
  options:
    - "-N -l                   one line per node, long format"
    - "-R                      drained/down nodes with the reason"
  read:
    - "STATE: idle, alloc, mix, drain, drng, down, inval. A '*' after a state means the node is not responding."

squeue:
  summary: Slurm job queue
  purpose: Lists pending and running jobs, with the reason a pending job is waiting.
  when: Users say their job 'is stuck' or 'never starts'.
  options:
    - "-u USER / -p PARTITION / -j JOBID"
    - "-l or -o '%i %P %j %u %T %r'   include the state and reason"
  read:
    - "NODELIST(REASON) for pending jobs: Resources, Priority, ReqNodeNotAvail, PartitionDown, QOS... limits."

scontrol:
  summary: inspect and change Slurm state
  purpose: Shows detailed node/job/partition records and changes them (drain, resume, update).
  when: You need the details behind sinfo/squeue, or to take nodes in or out of service.
  options:
    - "show node|job|partition|config [NAME]"
    - "update NodeName=N State=DRAIN Reason=\"...\"   (State=RESUME to return it)"
    - "reconfigure             make slurmctld re-read slurm.conf"
  read:
    - "Node: State=, Reason=, Gres=, CfgTRES/AllocTRES. Job: JobState=, Reason=, TRES requested."
  errors:
    - "'Invalid node state specified' / 'Reason required to drain'."

sbatch:
  summary: submit a Slurm batch script
  purpose: "Queues a script; #SBATCH lines at the top set resources (nodes, GPUs, tasks, time, partition)."
  when: Running or testing a batch workload.
  options:
    - "--gres=gpu:N (per node) / --gpus=N (per job total) / --gpus-per-node=N"
    - "-N NODES, --ntasks-per-node=N, -p PARTITION, --exclusive, --wrap='cmd'"
  read:
    - "'Submitted batch job N', then follow it with squeue -j N and sacct -j N."
  errors:
    - "'Requested node configuration is not available': the request can never fit."

srun:
  summary: run a command as a Slurm job step
  purpose: Launches tasks on allocated nodes (interactively or inside sbatch); with pyxis it can run containers.
  when: Quick tests on compute nodes, or launching parallel tasks inside a batch job.
  options:
    - "-N, --ntasks-per-node, --gres / --gpus, -w NODE"
    - "--container-image=REGISTRY#IMAGE:TAG   (pyxis; note the # after the registry)"

sacctmgr:
  summary: manage Slurm accounting (accounts, users, QOS, limits)
  purpose: Creates accounts and users, sets fair-share and QOS limits in slurmdbd.
  when: Onboarding users or teams, or enforcing limits.
  options:
    - "show assoc|account|user|qos [format=...] [tree]"
    - "add account|user|qos NAME [property=value ...]"
    - "modify qos|user NAME set property=value"
  read:
    - "Limits only apply when AccountingStorageEnforce in slurm.conf includes them."

kubectl:
  summary: Kubernetes command-line client
  purpose: Lists and inspects cluster objects (nodes, pods, events), applies manifests and reads container logs.
  when: Pods are Pending, crashing or not using GPUs; nodes are NotReady.
  options:
    - "get nodes|pods -A -o wide"
    - "describe pod|node NAME [-n NS]   events at the bottom explain scheduling and pull problems"
    - "logs POD [-n NS] [-p]   container output (-p: the previous, crashed container)"
    - "apply -f FILE, delete, label, taint, cordon, drain"
    - "set image deploy/NAME C=IMAGE, rollout history|undo, expose, explain, config get-contexts"
  read:
    - "Pod STATUS (Pending, ContainerCreating, CrashLoopBackOff, ImagePullBackOff) and RESTARTS."
    - "FailedScheduling events: '0/N nodes are available: <reason per node>'."
    - "Node Allocatable nvidia.com/gpu: what the device plugin advertises."

helm:
  summary: Kubernetes package manager
  purpose: Installs and upgrades charts (e.g. the NVIDIA GPU Operator and Network Operator) with configurable values.
  when: Deploying or reconfiguring operator stacks.
  options:
    - "repo add NAME URL / repo update"
    - "install|upgrade RELEASE CHART -n NS [--create-namespace] [--set key=value] [-f values.yaml]"
    - "list -A, get values RELEASE -n NS [-a], uninstall"
  read:
    - "get values shows what you set; -a shows the computed values including chart defaults."

docker:
  summary: container engine CLI
  purpose: Pulls images and runs containers; GPUs are passed in via the NVIDIA Container Toolkit.
  when: Running or debugging containers on a single host.
  options:
    - "run --rm --gpus all|N|'\"device=0,1\"' IMAGE CMD"
    - "ps -a, logs NAME, inspect NAME, exec NAME CMD, info"
    - "login nvcr.io (user $oauthtoken, password = NGC API key)"
  errors:
    - "'could not select device driver \"\" with capabilities: [[gpu]]': the GPU runtime is not set up for Docker."
    - "'unauthorized' on pull: not logged in to that registry."

nvidia-ctk:
  summary: NVIDIA Container Toolkit CLI
  purpose: Configures container runtimes (Docker, containerd, CRI-O) to use the NVIDIA runtime, and generates CDI specs.
  when: Setting up GPU containers on a new host or fixing a runtime config.
  options:
    - "runtime configure --runtime=docker|containerd [--set-as-default]"
    - "cdi generate --output=FILE"
    - "--version"
  read:
    - "It edits the runtime's config file; the runtime must be restarted to pick it up."

crictl:
  summary: inspect containers through the CRI (containerd) on a Kubernetes node
  purpose: Lists pods, containers and images as the kubelet's runtime sees them.
  when: Debugging at node level when kubectl alone does not explain a failure.
  options:
    - "ps -a, pods, images, logs CONTAINER_ID, info"

cmsh:
  summary: NVIDIA Base Command Manager shell
  purpose: Manages the cluster's nodes, categories, software images, users and power through BCM.
  when: Provisioning, changing node configuration cluster-wide, power control, image updates.
  options:
    - "cmsh -c \"MODE; use OBJECT; show|get|set ...; commit\"   (commands separated by ;)"
    - "modes: device, category, softwareimage, partition, user"
    - "device status / power status|on|off -n NODES / imageupdate [-w] -n NODES"
  read:
    - "Changes are staged until commit; an asterisk in the prompt means uncommitted changes."
    - "Node settings override category settings, which override partition defaults."

ibstat:
  summary: InfiniBand adapter and port status
  purpose: Shows each HCA port's state, physical state and rate.
  when: Multi-node jobs are slow or fail and you suspect the fabric.
  read:
    - "State: Active and Physical state: LinkUp are healthy. Down / Polling means no working link."
    - "Rate lower than the others on the node means the link trained at a degraded speed."

mlxlink:
  summary: NVIDIA (Mellanox) link diagnostics for one port
  purpose: Shows link state, speed, cable/module information and signal levels, and can toggle a port.
  when: A port is down or degraded and you need to know whether it is cable, module or configuration.
  options:
    - "-d DEVICE (e.g. a CA name or /dev/mst path)"
    - "-m                      module (transceiver) and cable info, including RX power"
    - "-c                      error counters"
  read:
    - "Very low RX power or 'No module' points at the physical layer (cable, transceiver, seating)."

ibdiagnet:
  summary: fabric-wide InfiniBand diagnostics
  purpose: Scans the fabric for down links, speed/width mismatches and error counters.
  when: Before and after fabric changes, or to locate a bad link from anywhere in the cluster.
  read:
    - "The summary lists links with errors or degraded speed; details go to the log file it names."

all_reduce_perf:
  summary: NCCL tests benchmark (collective bandwidth)
  purpose: Measures collective communication bandwidth across GPUs and nodes.
  when: To prove a fabric or GPU-communication fix actually restored performance.
  options:
    - "-b MIN -e MAX -f 2 -g GPUS   size range and GPUs per process"
    - "launched across nodes with mpirun -np N -H host:slots,..."
    - "NCCL_DEBUG=INFO (environment) prints which transport NCCL chose and why"
  read:
    - "busbw at the largest sizes is the number to compare. 'NET/Socket' instead of 'NET/IB' means no InfiniBand."

mpirun:
  summary: launch MPI processes (Open MPI)
  purpose: Starts N copies of a program across hosts, used to run NCCL tests and MPI training jobs.
  options:
    - "-np N -H host1:slots,host2:slots PROGRAM"
    - "-x VAR[=value]          pass environment variables to remote ranks"
    - "--allow-run-as-root     required when running as root"

lsmod:
  summary: list loaded kernel modules
  purpose: Shows which drivers are loaded (nvidia, nvidia_uvm, nvidia_peermem, mlx5_core, nvidia_fs ...).
  when: A feature that depends on a kernel module is not working.
  read:
    - "Module names use underscores even if you loaded them with dashes."

modprobe:
  summary: load or unload kernel modules
  purpose: Loads (or with -r removes) a kernel module and its dependencies.
  read:
    - "Loading by hand lasts until reboot; files in /etc/modules-load.d make it permanent."
  errors:
    - "'Module X is in use': something still uses it; stop that first."

ipmitool:
  summary: talk to the server's BMC (IPMI)
  purpose: Reads hardware sensors and the System Event Log, and controls chassis power.
  when: Suspected hardware faults (fans, PSUs, temperature) or a node that will not power on.
  options:
    - "sel list                hardware event log"
    - "sdr                     sensor readings (fans, temperatures, PSUs)"
    - "power status|on|off|cycle"
    - "chassis status          power state and fault flags in one page"

pdsh:
  summary: run one command on many nodes in parallel
  purpose: Runs the same command over ssh on a list of nodes and prefixes every output line with the node name, so one screen compares the whole cluster.
  when: Checking that every DGX agrees (driver version, a kernel module, a mount, a service) or applying a one-off command before you make it permanent in BCM.
  options:
    - "-w dgx-0[1-4] CMD        the nodes, as a hostlist"
    - "-g CATEGORY CMD          every node of a BCM category"
    - "-a CMD                   every compute node; -x HOSTLIST leaves some out"
  read:
    - "A node that does not answer prints an ssh error on its own line: powered off, or not reachable."
    - "Sort the output (pdsh ... | sort) to see the nodes side by side; dshbak is the real tool for that."

ibdev2netdev:
  summary: map InfiniBand devices to their network interfaces
  purpose: Prints which netdev belongs to each HCA port and whether the port is up, which is what you need before reading ibstat or ethtool for the right device.
  when: A fabric port is down or a NIC is missing and you need to know which mlx5_N it is.
  read:
    - "Eight lines on a healthy DGX H100, all (Up). (Down) names the port to look at with ibstat and mlxlink."

lsblk:
  summary: list block devices
  purpose: Shows the drives, partitions and RAID arrays with their sizes and mount points.
  when: Disk space or a missing /raid mount; before touching anything with mkfs or mdadm.
  options:
    - "-d                      drives only"
    - "-o NAME,SIZE,TYPE,MOUNTPOINT   the columns you want"

last:
  summary: recent logins and reboots
  purpose: Shows who logged in when and, at the end, when the system last booted.
  when: Finding out whether someone was on the node when a problem started, or when it rebooted.

nvsm:
  summary: NVIDIA System Management CLI on a DGX (health, firmware versions, support dump)
  purpose: Asks the NVSM daemon about the hardware the OS cannot see by itself, such as the NVSwitches and their firmware, PSUs, fans, drives and the BMC.
  when: A DGX behaves differently from its neighbours after maintenance, or before and after a firmware update.
  options:
    - "show health            every health check with OK/FAIL and a reason"
    - "show versions          BMC, BIOS, VBIOS, NVSwitch, ConnectX, driver and Fabric Manager versions"
    - "show alerts            the checks that currently fail"
    - "show gpus|storage|power|fans   one subsystem in detail"
    - "dump health            support bundle under /tmp"
    - "update firmware --type nvswitch|bmc|bios|all   stage an update, applied at the next reboot"
  read:
    - "Health Summary: Unhealthy means at least one [FAIL] line; read the reason on that line."
    - "NVSwitch firmware must be the same on every switch; differing versions break the NVLink fabric."

numactl:
  summary: NUMA topology and memory/CPU binding
  purpose: Shows NUMA nodes and their CPUs, or runs a program bound to particular nodes.
  when: Performance differs between identical nodes, or CPU threads may be far from their GPU.
  options:
    - "-H / --hardware         NUMA nodes, CPUs and distances"
    - "--show                  the current process's binding"
  read:
    - "Compare with `nvidia-smi topo -m`: each GPU lists its CPU and NUMA affinity."

df:
  summary: mounted filesystems and free space
  options:
    - "-h                      human-readable sizes"
    - "-T                      show the filesystem type (nfs, lustre, ext4 ...)"
  read:
    - "A path missing from the list is not mounted; check what is mounted at the path you expect."

findmnt:
  summary: show mounts as a tree, with options
  options:
    - "findmnt PATH            what is mounted there and with which options"
    - "--fstab                 what /etc/fstab says should be mounted"

mount:
  summary: list or mount filesystems
  options:
    - "(no options)            list current mounts"
    - "-a                      mount everything in /etc/fstab"
    - "-t nfs SERVER:/export /path"

enroot:
  summary: unprivileged container runtime used by pyxis with Slurm
  options:
    - "import docker://REGISTRY#IMAGE:TAG   (note the # after the registry)"
    - "create IMAGE.sqsh, list, start NAME"

runai:
  summary: NVIDIA Run:ai CLI (workloads, projects and quotas)
  purpose: Submits and inspects workloads in Run:ai projects, which share GPU quota between teams.
  when: Workloads are pending, preempted or need fractional GPUs.
  options:
    - "list jobs|projects / workload list   (older and newer CLI syntax both exist)"
    - "describe job NAME -p PROJECT"
    - "submit NAME -i IMAGE -g GPUS -p PROJECT   (-g 0.5 requests half a GPU)"
  read:
    - "Deserved quota vs over-quota: over-quota workloads may run on idle GPUs but can be preempted."

gdscheck:
  summary: GPUDirect Storage platform check
  purpose: Reports whether GDS can be used on this node and for which filesystems.
  options:
    - "-p                      platform check"
  read:
    - "If the nvidia_fs driver is missing, GDS silently falls back to compatibility mode (slower)."

mlxconfig:
  summary: query or change NVIDIA NIC / BlueField firmware configuration
  options:
    - "-d DEVICE q             query current and next-boot settings"
    - "-d DEVICE s KEY=VALUE   set (takes effect after a reset or reboot)"
  read:
    - "Next-boot values differ from current ones until the device is reset."

ssh:
  summary: log in to another node, or run one command there
  options:
    - "ssh NODE                open a shell on NODE (exit to come back)"
    - "ssh NODE CMD            run CMD on NODE and print its output"
  read:
    - "The prompt shows which node you are on. Many tools only report the node they run on."

sacct:
  summary: "Slurm accounting: the final state of finished jobs"
  purpose: Reads the accounting database (slurmdbd) for jobs that squeue no longer shows, with their state, exit code, nodes and resources.
  when: A job "disappeared", ended early or failed overnight and you need what Slurm decided and where it ran.
  options:
    - "-j JOBID[,JOBID]        one or more jobs (a step suffix such as 1234.batch matches the job)"
    - "-u USER / -a            one user's jobs; root sees everyone, others need -a to widen"
    - "-X                      allocations only, without the .batch and .extern step rows"
    - "-S / -E WHEN            jobs that started or ended in a window (YYYY-MM-DD[THH:MM], now-2days)"
    - "--format=JobID,JobName%30,State%20,ExitCode,NodeList,Elapsed,ReqMem   pick columns; %N widens one"
    - "-p / -P                 '|'-delimited output when a column is cut off (OUT_OF_ME+)"
    - "-s STATES               only jobs in these states (FAILED, TIMEOUT, OOM)"
  read:
    - "State and ExitCode together: COMPLETED 0:0; FAILED 1:0 (the script exited 1); OUT_OF_MEMORY 0:125; TIMEOUT 0:0; NODE_FAIL; CANCELLED by USERID."
    - "NodeList says which node to read journals and dmesg on; Elapsed against Timelimit explains a TIMEOUT."
    - "A '+' at the end of a value means the column was too narrow; widen it with --format or use -p."
  errors:
    - "'Problem talking to the database': slurmdbd is down or unreachable, accounting cannot be read."
    - "'option requires an argument': -j and --jobs need a job id."

salloc:
  summary: ask for an interactive allocation and work inside it
  purpose: Reserves nodes, CPUs, GPUs and memory like sbatch, then opens a shell on the submit host with SLURM_* set; srun inside it lands on the allocated nodes.
  when: Debugging a job interactively, testing a container or a GPU before writing the batch script.
  options:
    - "-N NODES -n TASKS -c CPUS --gres=gpu:N --mem=SIZE -t TIME -p PARTITION   the same resource options as sbatch"
    - "salloc ... srun CMD     run one command in the allocation and release it"
    - "--test-only             show when and where the allocation would start, without creating it"
  read:
    - "'Granted job allocation N' then your prompt again: you are still on the submit host; srun or ssh to reach the nodes."
    - "exit (or Ctrl-D) prints 'Relinquishing job allocation N' and frees the nodes; scancel N does the same from elsewhere."
  errors:
    - "'Requested node configuration is not available': the resources asked for do not exist on any node."

scancel:
  summary: cancel or signal Slurm jobs
  purpose: Ends pending or running jobs, one by id or a whole set by user, partition, state or name, or sends them a signal.
  when: A job is stuck, wrong, or has to make way; cleaning up after a user; draining work before maintenance.
  options:
    - "scancel JOBID [JOBID...]        by id; 1234_3 is one array task, 1234 the whole array"
    - "-u USER / -p PARTITION / -t PENDING|RUNNING / -n NAME   filters, combined; required when no id is given"
    - "-s SIGNAL                       send a signal (USR1, TERM) instead of cancelling"
    - "--me                            only your own jobs"
  read:
    - "No output means success; sacct shows the job as CANCELLED by your uid afterwards."
  errors:
    - "'Access/permission denied': the job belongs to another user and you are not root or a Slurm admin."
    - "'Invalid job id specified': the id does not exist or has already finished."

sshare:
  summary: fair-share usage and shares per account and user
  purpose: "Shows the share tree Slurm uses for priority: raw shares, normalised shares, usage so far and the resulting fair-share factor."
  when: Users ask why their jobs wait behind others, or when checking that accounts and limits are set up as intended.
  options:
    - "(no options)            your own account tree"
    - "-a                      every user; -A ACCOUNTS / -u USERS to narrow"
    - "-l                      add LevelFS, the within-level fair-share value"
  read:
    - "FairShare near 1 has used little of its share and is favoured; near 0 has used more than its share."
    - "A user missing from the tree has no association: sacctmgr add user is the fix, not a priority change."

sprio:
  summary: why a pending job has the priority it has
  purpose: "Breaks a pending job's priority into its factors: age, fair-share, job size, partition and QOS."
  when: Two pending jobs are ordered unexpectedly, or you need to see which factor dominates on this cluster.
  options:
    - "-j JOBID                one job"
    - "-l                      every factor as a column"
  read:
    - "The weights come from PriorityWeight* in slurm.conf; a factor with weight 0 never contributes."
    - "Only pending jobs are listed; a running job has no priority to show."

ngc:
  summary: NVIDIA NGC command-line client (registry, configuration)
  purpose: Logs the host in to nvcr.io with an API key, and lists or inspects container images and models in the NGC registry.
  when: Pulling an NGC container fails with an authentication error, or you need an image's tags and size before a pull.
  options:
    - "ngc config set            enter the API key, output format, org and team (saved under ~/.ngc)"
    - "ngc config current        show what is configured and from where"
    - "ngc registry image list [org/name]   images and tags; ngc registry image info org/name:tag   details"
    - "ngc registry image pull org/name:tag   pull through the configured credentials"
  read:
    - "The API key is the '$oauthtoken' user's password for docker login nvcr.io and enroot import; the same key serves both."
  errors:
    - "'Invalid apikey' or 401: wrong or expired key; set it again with ngc config set."
    - "'Unauthorized' on a private image: the key's org or team does not match the image's."

nvidia-bug-report.sh:
  summary: collect the diagnostic bundle NVIDIA support asks for
  purpose: Gathers the driver state, nvidia-smi output, dmesg, Xids, lspci, kernel modules and system logs into nvidia-bug-report.log.gz in the current directory.
  when: Before opening a hardware or driver case, and before a reboot or GPU reset that would erase the evidence.
  options:
    - "(no options)            run as root on the affected node; takes a few seconds"
  read:
    - "The file name printed at the end is what goes into the support ticket, together with the GPU's serial and UUID."
    - "Collect it before resetting the GPU or rebooting: the ring buffer and Xid history disappear with them."

nv-fabricmanager:
  summary: the NVIDIA Fabric Manager binary behind the nvidia-fabricmanager service
  purpose: Configures the NVSwitch fabric on DGX nodes; without it running, the GPUs cannot use NVLink across switches and CUDA jobs fail to start.
  when: NCCL or CUDA report fabric errors, or nvidia-smi shows NVLinks down on a node with NVSwitches.
  options:
    - "--version               the installed version, which must match the driver"
    - "systemctl and journalctl on the nvidia-fabricmanager unit   whether the service runs and why it stopped"
  read:
    - "A version that differs from the driver, or NVSwitch firmware that differs between switches, keeps the service from starting."

ibstatus:
  summary: compact state of the InfiniBand ports
  purpose: Prints each HCA port's state, physical state, rate, LID and GID without the detail of ibstat.
  when: A quick check that every port is ACTIVE at the expected rate after a cable, firmware or driver change.
  options:
    - "(no options)            every port; ibstatus mlx5_3 or mlx5_3:1 for one"
  read:
    - "state 4: ACTIVE and phys state 5: LinkUp is healthy; 1: DOWN / 2: Polling means no link; INIT means a link without a subnet manager."
    - "rate below the fabric's nominal speed (400 Gb/sec 4X NDR) points at a cable, transceiver or port setting."

ibv_devinfo:
  summary: the RDMA verbs view of the HCAs
  purpose: Lists the RDMA devices with firmware, node GUID, port state and MTU, as applications using libibverbs (NCCL, GPUDirect RDMA) see them.
  when: A port looks fine in ibstat but RDMA traffic fails, or you need firmware versions and GUIDs for a ticket.
  options:
    - "-l                      device names only"
    - "-d mlx5_N               one device; -v adds every attribute"
  read:
    - "port state PORT_ACTIVE and link_layer InfiniBand; a device missing here is missing for RDMA even if the netdev exists."

perfquery:
  summary: InfiniBand port error and traffic counters
  purpose: "Reads the performance counters of a port: symbol errors, link recoveries, link downs, receive errors and the data counters."
  when: A fabric link is flapping or slow and you need to know whether errors are accumulating, and whether they stop after a fix.
  options:
    - "(no options)            the local port 1; perfquery LID PORT for a remote port"
    - "-x                      extended (64-bit) counters, needed for the data counters at NDR rates"
    - "-r                      read then reset the counters; run it, wait, run again to measure a rate"
  read:
    - "SymbolErrorCounter and LinkDownedCounter rising on one port isolate the bad cable or transceiver; a clean port stays at 0."

mst:
  summary: Mellanox Software Tools device service
  purpose: Loads the MST kernel modules and lists the NVIDIA networking devices the firmware tools (mlxconfig, mlxlink, flint) address.
  when: mlxconfig or mlxlink say no devices are found, or you need the /dev/mst device names.
  options:
    - "mst start               load the modules and create the /dev/mst devices"
    - "mst status [-v]         module state and the devices with their PCI addresses and names"
  read:
    - "'MST PCI module is not loaded' means mst start has not been run since boot; the firmware tools need it."

munge:
  summary: create a MUNGE credential to test the key
  purpose: Encodes a credential with the local munge.key; decoding it on another node proves both share the key and have munged running, which Slurm needs between every node.
  when: Slurm reports 'Invalid credential' or a node will not register with the controller.
  options:
    - "munge -n | unmunge                   round trip on one node"
    - "munge -n | ssh NODE unmunge          the key check that matters: encode here, decode there"
  read:
    - "STATUS: Success (0) with the right ENCODE_HOST; 'Invalid credential' means different keys, 'Socket' errors mean munged is not running."

unmunge:
  summary: decode a MUNGE credential
  purpose: Validates a credential read from stdin and prints who created it, where and when.
  when: The other half of the munge key test across nodes.
  options:
    - "munge -n | unmunge"
  read:
    - "STATUS: Success (0) is the only good answer; anything else names the mismatch (key, clock skew, daemon)."

showmount:
  summary: what an NFS server exports
  purpose: Asks an NFS server for its export list and the clients allowed to mount each export.
  when: A mount fails or a node is missing a shared file system and you need to know whether the server offers it to that node.
  options:
    - "showmount -e SERVER     the export list"
  read:
    - "An export that lists a network the node is not in, or that is missing, is a server-side fix in /etc/exports and exportfs, not a client one."

exportfs:
  summary: show or reload the NFS exports on the server
  purpose: Lists what the server currently exports with its options, and reloads /etc/exports after an edit.
  when: After changing /etc/exports, or to check whether the running export table matches the file.
  options:
    - "exportfs -v             the active exports with their options (rw, no_root_squash, ...)"
    - "exportfs -ra            re-export everything from /etc/exports; -s prints the file as the kernel reads it"
  read:
    - "A line in /etc/exports that is not in exportfs -v has not been applied yet."

cm-wlm-setup:
  summary: BCM's workload-manager setup wizard
  purpose: "Installs and configures Slurm (or another scheduler) on a BCM cluster: the controller role, the client role per category, the submit hosts and the queues. It is interactive, so the lab shows what it produced instead."
  when: Understanding where a BCM cluster's Slurm configuration lives, or adding Slurm to a cluster that has none.
  options:
    - "cmsh -c \"wlm; list\" / \"wlm; use slurm; jobqueue; list\"   the instance and queues the wizard created"
    - "configurationoverlay mode in cmsh                            the role assignments it made"
  read:
    - "Everything the wizard writes is a cmsh object; slurm.conf is generated from those objects, which is why hand edits do not last."

cm-kubernetes-setup:
  summary: BCM's Kubernetes setup wizard
  purpose: Deploys a Kubernetes cluster on BCM nodes with the operators BCM ships, and manages the users who get a kubeconfig. The deployment is interactive; user management works from the command line.
  when: Giving a user access to the cluster, or finding out what the wizard installed.
  options:
    - "cm-kubernetes-setup --add-user NAME     create the user's kubeconfig; --list-users shows who has one"
    - "kubectl get nodes / helm list -A       what the wizard deployed"
  read:
    - "Users added here get ~/.kube/config on the head node; a user who cannot run kubectl usually has not been added."

cmha:
  summary: BCM head node high-availability status
  purpose: Reports which head node is active and which is passive, the shared state and the result of the last failover checks.
  when: After a head node failover, or when cmsh and the services behave as if the head is not the active one.
  options:
    - "cmha status"
  read:
    - "The active head node runs CMDaemon's primary; a check that reports a failure names the service that did not come over."

cm-chroot-sw-img:
  summary: run a command inside a BCM software image
  purpose: Enters the image directory under /cm/images as a chroot so packages and files can be changed in the image before it is pushed to nodes.
  when: Installing a package or driver into the image that every node of a category boots from.
  options:
    - "cm-chroot-sw-img /cm/images/IMAGE            an interactive shell in the image (not available in the lab)"
    - "chroot /cm/images/IMAGE apt-get install PKG  the same change as one command"
  read:
    - "A change in the image reaches nodes only after imageupdate (running nodes) or a reboot that reprovisions."

dpkg:
  summary: installed Debian packages on the node or in an image
  purpose: Lists installed packages with their versions; combined with chroot it shows what a BCM image contains.
  when: Checking which driver, CUDA, DCGM, Fabric Manager or Slurm version a node has, and whether every node agrees.
  options:
    - "dpkg -l [PATTERN]       installed packages matching the pattern (nvidia-*, slurm*)"
    - "chroot /cm/images/IMAGE dpkg -l PATTERN   the same inside an image"
  read:
    - "ii in the first column is installed; rc is removed with config files left; pdsh -w NODES dpkg -l PKG compares nodes."

apt-get:
  summary: install or update Debian packages
  purpose: Installs packages on a node or, through chroot, into a BCM software image.
  when: Adding a tool or a newer package to an image before pushing it to nodes.
  options:
    - "apt-get update && apt-get install -y PKG"
    - "chroot /cm/images/IMAGE apt-get install -y PKG   change the image, then imageupdate"
  read:
    - "Installing on one running node fixes only that node and is lost at the next reprovision; the image is the durable place."

hwticket:
  summary: lab helper standing in for the vendor support portal
  purpose: Opens and lists hardware support cases for a node and a component, with the evidence summary support expects.
  when: A lab asks you to hand a failing GPU, cable, fan or PSU to hardware support after diagnosing it.
  options:
    - "hwticket create --node NODE --component gpu|fan|psu|cable|hca|nvswitch|memory --summary \"evidence\" [--severity 1-4]"
    - "hwticket list / hwticket show ID"
  read:
    - "Support wants the part identified (index, serial, UUID or port) and the evidence (Xid, counters, SEL entries), plus an nvidia-bug-report.log.gz."

reseat-cable:
  summary: lab helper standing in for a technician's visit
  purpose: Reseats the cable or transceiver of one InfiniBand port on a node, as a technician would in the data centre.
  when: A lab's diagnosis points at a specific port with link errors and the fix is physical.
  options:
    - "reseat-cable NODE mlx5_N"
  read:
    - "Check the port again afterwards (ibstat, perfquery -r then re-read) to confirm the errors stopped."

dataloader-bench:
  summary: lab helper that runs only a training job's input pipeline
  purpose: Measures the samples per second the data pipeline can deliver, against what the GPUs consume, to tell a storage or CPU bottleneck from a GPU one.
  when: A training job shows low GPU utilisation and you suspect the input side.
  options:
    - "dataloader-bench [options]   see --help on the node"
  read:
    - "Delivered samples/s below what the GPUs can consume means the bottleneck is before the GPU: workers, storage or the network."
