[project]
name = "greenray-aio"
version = "0.5.0"
description = "GreenRay AIO: hands-on lab simulator and mock exam for the NVIDIA NCP-AIO (AI Operations) certification"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Rehmana Younis" }]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = [
    "ncp-aio", "nvidia-certification", "ai-infrastructure", "ai-operations", "exam-prep",
    "slurm", "kubernetes", "gpu-operator", "base-command-manager", "dgx", "hpc", "simulator",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
    "Topic :: System :: Clustering",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "prompt-toolkit>=3.0.43",
    "pyyaml>=6.0",
    "rich>=13.7",
]

[project.urls]
Homepage = "https://github.com/RehmanaYounis/greenray-aio"
Issues = "https://github.com/RehmanaYounis/greenray-aio/issues"

[project.scripts]
greenray = "greenray.cli:main"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "pytest>=8",
    "pytest-cov>=7.1.0",
    "ruff>=0.6",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.uv.build-backend]
module-name = "greenray"

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["greenray"]
branch = true

[tool.coverage.report]
skip_empty = true
show_missing = false

[tool.mypy]
python_version = "3.10"
files = ["src/greenray/config.py", "src/greenray/cli.py", "src/greenray/core", "src/greenray/content", "src/greenray/app"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
ignore_missing_imports = true
# The command emulators (src/greenray/commands) are type-checked gradually.

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = [
    "E501",    # long realistic command output lines are intentional
    "SIM102",  # nested ifs mirror the command-line parsing they emulate
    "SIM108",
    "E741",    # short names like `l` for NVLink ids mirror the tools' own terminology
    "B904",    # CommandError deliberately replaces the Python traceback with tool-style output
    "B905",    # zip() over equal-length parsed columns
]

[tool.ruff.lint.isort]
known-first-party = ["greenray"]
