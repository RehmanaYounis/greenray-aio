id: ins-storage-shared-mounts
code: ins-6
title: Jobs on the new DGX category can't find /home
domain: Installation and Deployment
difficulty: medium
time_limit_min: 20
tags: [bcm, cmsh, storage, nfs, fsmounts, slurm]
briefing: |
  The DGX nodes were moved into the new `dgx-h100` category last week. Since
  then every job that uses a home directory fails. alice's fine-tuning job
  4001 died with "couldn't chdir to /home/alice/llm" and a missing config file.
  Modules from /cm/shared are gone on those nodes too.

  The head node exports /home and /cm/shared over NFS, as on every BCM cluster.
  Make both available on all DGX nodes in a way that survives reprovisioning,
  then rerun alice's job (/home/alice/llm/train.sbatch, submitted as alice) and
  show that it completes.
objectives:
  - The dgx-h100 category has correct fsmounts for /home and /cm/shared (NFS from the head node)
  - All four DGX nodes have both filesystems mounted
  - alice's llm-ft job runs successfully
setup:
  - python: |
      from greenray.commands.storage import DEFAULT_EXPORTS, NFS_OPTS
      head = state.nodes['bcm-head']
      head.files['/etc/exports'] = DEFAULT_EXPORTS
      head.files['/home/alice/llm/config.yaml'] = (
          "model: meta-llama/Meta-Llama-3-8B\n"
          "dataset: /home/alice/llm/data/alpaca-cleaned.jsonl\n"
          "micro_batch_size: 4\n"
          "precision: bf16-mixed\n")
      head.files['/home/alice/llm/data/alpaca-cleaned.jsonl'] = '{"instruction": "...", "output": "..."}\n'
      head.files['/home/alice/llm/train.sbatch'] = (
          "#!/bin/bash\n"
          "#SBATCH -J llm-ft\n"
          "#SBATCH -N 1\n"
          "#SBATCH --gres=gpu:8\n"
          "#SBATCH -D /home/alice/llm\n"
          "#SBATCH -o /home/alice/llm/llm-ft-%j.out\n"
          "cat /home/alice/llm/config.yaml\n"
          "ls /cm/shared/modulefiles\n")
      head.files['/cm/shared/modulefiles/nccl/2.21.5'] = "#%Module1.0\nprepend-path LD_LIBRARY_PATH /cm/shared/apps/nccl/2.21.5/lib\n"
      head.files['/cm/shared/modulefiles/cuda12.4/toolkit/12.4.1'] = "#%Module1.0\nprepend-path PATH /cm/shared/apps/cuda12.4/toolkit/12.4.1/bin\n"
      head.files['/home/alice/llm/llm-ft-4001.out'] = (
          "slurmstepd: error: couldn't chdir to `/home/alice/llm': No such file or directory: going to /tmp instead\n"
          "cat: /home/alice/llm/config.yaml: No such file or directory\n")
      cat = state.bcm.categories['dgx-h100']
      cat.fsmounts = [{'mountpoint': '/cm/shared', 'device': 'master:/cm/share', 'filesystem': 'nfs',
                       'mountoptions': NFS_OPTS}]
      fstab = ("# /etc/fstab: static file system information.\n"
               "UUID=6f1e2d3c-0b9a-4c8d-9e7f-1a2b3c4d5e6f /          ext4 errors=remount-ro 0 1\n"
               "UUID=4C1A-9F2E                            /boot/efi  vfat umask=0077        0 1\n"
               "/dev/md1                                  /raid      ext4 defaults,nofail    0 0\n"
               "# This section of this file was automatically generated by cmd. Do not edit manually!\n"
               "# BEGIN AUTOGENERATED SECTION -- DO NOT REMOVE\n"
               f"master:/cm/share         /cm/shared       nfs    {NFS_OPTS} 0 0\n"
               "# END AUTOGENERATED SECTION   -- DO NOT REMOVE\n")
      for n in ('dgx-01', 'dgx-02', 'dgx-03', 'dgx-04'):
          nd = state.nodes[n]
          nd.files['/etc/fstab'] = fstab
          nd.mounts = [
              {'source': '/dev/nvme0n1p2', 'target': '/', 'fstype': 'ext4', 'options': 'rw,relatime'},
              {'source': '/dev/nvme0n1p1', 'target': '/boot/efi', 'fstype': 'vfat', 'options': 'rw,relatime'},
              {'source': '/dev/md1', 'target': '/raid', 'fstype': 'ext4', 'options': 'rw,relatime'},
              {'source': 'tmpfs', 'target': '/dev/shm', 'fstype': 'tmpfs', 'options': 'rw,nosuid,nodev'},
          ]
          nd.journal['cmd'] = [
              f"2026-10-12 08:14:02 {n} cmd[2210]: Mounting master:/cm/share on /cm/shared",
              f"2026-10-12 08:14:02 {n} cmd[2210]: mount.nfs: access denied by server while mounting master:/cm/share",
          ]
      st = state.slurm
      st.users['alice'] = {'name': 'alice', 'default_account': 'root'}
      state.bcm.users['alice'] = {'name': 'alice', 'uid': 2001, 'groups': ['alice'], 'password': 'x',
                                  'home': '/home/alice', 'shell': '/bin/bash'}
      st.jobs.append({'id': 4001, 'name': 'llm-ft', 'user': 'alice', 'partition': 'defq', 'state': 'FAILED',
                      'exit_code': '1:0', 'num_nodes': 1, 'gpus_per_node': 8, 'nodelist': ['dgx-02'],
                      'submit_time': -3600, 'start_time': -3590, 'end_time': -3580, 'batch': True,
                      'work_dir': '/home/alice/llm', 'stdout': '/home/alice/llm/llm-ft-4001.out',
                      'command': '/home/alice/llm/train.sbatch'})
      st.next_job_id = 4002
checks:
  - desc: you checked what is mounted and what the server exports (df / findmnt / mount / showmount)
    expr: ran(r'^(df|findmnt|mount|showmount)')
  - desc: category dgx-h100 has an NFS fsmount for /home from the head node
    expr: any(e.get('mountpoint') == '/home' and re.match(r'^(master|bcm-head|10\.141\.255\.254):/home/?$', e.get('device', '')) and e.get('filesystem', '').startswith('nfs') for e in bcm.categories['dgx-h100'].fsmounts)
  - desc: the /cm/shared fsmount points at the real export
    expr: any(e.get('mountpoint') == '/cm/shared' and re.match(r'^(master|bcm-head|10\.141\.255\.254):/cm/shared/?$', e.get('device', '')) for e in bcm.categories['dgx-h100'].fsmounts)
  - desc: nothing is left uncommitted in cmsh
    expr: not bcm.uncommitted
  - desc: all four DGX nodes have /home and /cm/shared mounted from the head node
    expr: all(any(m.target == t and m.source.split(':')[0] in ('master', 'bcm-head', '10.141.255.254') for m in nodes[n].get('mounts', [])) for n in ('dgx-01', 'dgx-02', 'dgx-03', 'dgx-04') for t in ('/home', '/cm/shared'))
  - desc: alice's llm-ft job ran successfully
    expr: any(j.id > 4001 and j.user == 'alice' and j.name == 'llm-ft' and j.state in ('RUNNING', 'COMPLETED') and j.get('final_state') != 'FAILED' for j in slurm.jobs)
hints:
  - "On a DGX node, compare df -h (or findmnt -t nfs,nfs4) with what the head node offers: showmount -e master. Then read /etc/fstab and journalctl -u cmd on the node."
  - "BCM writes the autogenerated section of each node's /etc/fstab from the fsmounts of the node's category (and device). A hand edit there is overwritten. Look at cmsh -c \"category; use dgx-h100; fsmounts; list\" and compare with the default category."
  - "In the fsmounts submode: add /home; set device master:/home; set filesystem nfs; set mountoptions ...; commit. Use the existing entry and fix its device with: use /cm/shared; set device master:/cm/shared."
  - "When you commit, BCM rewrites fstab and mounts on running nodes. Check with ssh dgx-01 df -h, then submit alice's script /home/alice/llm/train.sbatch as alice (su - alice -c with sbatch)."
references:
  - NVIDIA Base Command Manager 10 Administrator Manual (fsmounts, exporting and mounting filesystems)
  - nfs(5), exports(5), showmount(8) man pages
