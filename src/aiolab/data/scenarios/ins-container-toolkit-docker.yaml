id: ins-container-toolkit-docker
title: Docker can't see the GPUs on a freshly installed node
domain: Installation and Deployment
difficulty: easy
time_limit_min: 15
tags: [docker, nvidia-container-toolkit, containers, installation]
briefing: |
  dgx-03 is back from a motherboard RMA. The vendor reinstalled it with stock Ubuntu 22.04
  (not DGX OS), the NVIDIA data center driver 550 and Docker CE. `nvidia-smi` on the host
  shows all 8 GPUs, but the ML team's first test fails:

      root@dgx-03:~# docker run --rm --gpus all nvcr.io/nvidia/cuda:12.4.1-base-ubuntu22.04 nvidia-smi
      docker: Error response from daemon: could not select device driver "" with capabilities: [[gpu]].

  Make GPU containers work with Docker on dgx-03. The team's compose files select the
  runtime by name (`runtime: nvidia`), so Docker must also know an "nvidia" runtime.
  The provisioning system already added NVIDIA's apt repository for the container toolkit
  (/etc/apt/sources.list.d/nvidia-container-toolkit.list). Finish by proving it works with
  a CUDA container that runs nvidia-smi and sees all 8 GPUs.
objectives:
  - The NVIDIA Container Toolkit packages are installed on dgx-03
  - /etc/docker/daemon.json registers the nvidia runtime and the running Docker daemon has loaded it
  - A CUDA container on dgx-03 ran nvidia-smi and saw all 8 GPUs
setup:
  - python: |
      from aiolab.commands import container as ct
      n = state.nodes["dgx-03"]
      n.os = "Ubuntu 22.04.4 LTS"
      n.ctk_installed = False
      n.files.pop("/etc/nvidia-container-runtime/config.toml", None)
      n.files.pop("/etc/docker/daemon.json", None)
      n.files["/etc/apt/sources.list.d/nvidia-container-toolkit.list"] = (
          "deb [signed-by=/usr/share/keyrings/nvidia-container-toolkit-keyring.gpg] "
          "https://nvidia.github.io/libnvidia-container/stable/deb/$(ARCH) /\n")
      n.files["/usr/share/keyrings/nvidia-container-toolkit-keyring.gpg"] = "<binary OpenPGP keyring>\n"
      n.apt_fresh = False
      n.docker_images = ["hello-world:latest"]
      n.containers = [{"id": "5a1f0c9e7b21", "image": "hello-world:latest", "name": "vendor_smoke",
                       "status": "Exited (0) 2 days ago", "command": "/hello", "gpus": [], "runtime": "runc"}]
      n.pyxis_installed = False
      ct.container_init(state)
checks:
  - desc: nvidia-container-toolkit is installed on dgx-03
    expr: "nodes['dgx-03'].get('ctk_installed') is True and '/etc/nvidia-container-runtime/config.toml' in nodes['dgx-03'].files"
  - desc: /etc/docker/daemon.json registers the nvidia runtime
    expr: "re.search(r'\"nvidia\"\\s*:\\s*\\{[^}]*nvidia-container-runtime', file('dgx-03', '/etc/docker/daemon.json')) is not None"
  - desc: docker is running on dgx-03 and has loaded the nvidia runtime and GPU device driver
    expr: "nodes['dgx-03'].services.docker == 'active' and 'nvidia' in nodes['dgx-03'].runtime_loaded.docker.handlers and nodes['dgx-03'].runtime_loaded.docker.gpu_driver"
  - desc: a CUDA container on dgx-03 ran nvidia-smi and saw all 8 GPUs
    expr: "any(c['host'] == 'dgx-03' and c['gpus'] == 8 for c in flags.get('gpu_containers', []))"
hints:
  - "Docker's --gpus flag is served by the NVIDIA Container Toolkit (nvidia-container-runtime-hook). Is it installed? Try `dpkg -l | grep nvidia-container` or `nvidia-ctk --version` on dgx-03."
  - "A new apt repository is only visible after the package lists are refreshed: `apt-get update`, then `apt-get install -y nvidia-container-toolkit` (without -y, apt asks for confirmation and this shell answers no)."
  - "Installing the packages does not touch Docker's config. `nvidia-ctk runtime configure --runtime=docker` writes the nvidia runtime into /etc/docker/daemon.json. dockerd only reads that file, and only looks for the toolkit hook, when it starts, so restart it: `systemctl restart docker`."
  - "Verify: `docker info | grep -i runtime`, then `docker run --rm --gpus all nvcr.io/nvidia/cuda:12.4.1-base-ubuntu22.04 nvidia-smi`."
references:
  - NVIDIA Container Toolkit - Installation Guide (apt) and Configuring Docker
  - NVIDIA Container Toolkit - Specialized configurations with Docker (NVIDIA_VISIBLE_DEVICES, --gpus)
