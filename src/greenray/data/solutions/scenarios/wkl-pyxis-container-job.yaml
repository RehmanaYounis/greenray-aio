# Private solution for scenario wkl-pyxis-container-job
solution:
  - srun -p defq --gres=gpu:2 --container-image=nvcr.io/nvidia/pytorch:24.05-py3 python -c "import torch; print(torch.__version__, torch.cuda.device_count())"
  - cat /etc/slurm/plugstack.conf
  - ssh dgx-01
  - cat /etc/slurm/plugstack.conf
  - exit
  - echo "required /usr/lib/x86_64-linux-gnu/slurm/spank_pyxis.so" > /etc/slurm/plugstack.conf.d/pyxis.conf
  - srun -p defq --gres=gpu:2 --container-image=nvcr.io/nvidia/pytorch:24.05-py3 python -c "import torch; print(torch.__version__, torch.cuda.device_count())"
  - srun -p defq --gres=gpu:2 --container-image=nvcr.io#nvidia/pytorch:24.05-py3 python -c "import torch; print(torch.__version__, torch.cuda.device_count())"
  - sacct --format=JobID,JobName,State,ExitCode,AllocTRES%40
explanation: |
  Pyxis is a SPANK plugin. Slurm loads SPANK plugins from plugstack.conf in two
  places: in the client (srun/sbatch/salloc) on the submit host, which is where
  the --container-* options are registered and parsed, and in slurmstepd on the
  compute nodes, which is where Pyxis calls enroot to import and start the
  container. The upgrade replaced bcm-head's plugstack.conf with one that only
  includes plugstack.conf.d/*.conf, and that directory had no pyxis.conf.
  srun on the head node therefore didn't recognise --container-image at all.
  The compute nodes were fine.

  After that, the second error came from the image reference. enroot/Pyxis use
  [USER@][REGISTRY#]IMAGE[:TAG]. With "nvcr.io/nvidia/pytorch:24.05-py3" there
  is no '#', so the registry defaults to Docker Hub and the image name becomes
  "nvcr.io/nvidia/pytorch", which fails with 401 Unauthorized. Writing
  nvcr.io#nvidia/pytorch:24.05-py3 fixes it. Public NGC images such as
  nvidia/pytorch can be pulled anonymously. Private org/team images need an
  NGC API key in enroot's credentials file.
edge_cases:
  - "Private NGC images: add 'machine nvcr.io login $oauthtoken password <NGC_API_KEY>' to ~/.config/enroot/.credentials (or $ENROOT_CONFIG_PATH/.credentials) on the compute nodes."
  - "Docker syntax (docker run nvcr.io/nvidia/pytorch:24.05-py3) and enroot/Pyxis syntax (nvcr.io#nvidia/pytorch:24.05-py3) differ only in that one character. Exam questions test it."
  - "Large images take minutes to import on every job. Pre-import with 'enroot import -o /shared/pytorch.sqsh docker://nvcr.io#nvidia/pytorch:24.05-py3' and use --container-image=/shared/pytorch.sqsh, or name the container with --container-name to reuse it within a job."
  - "--container-mounts=/data:/data binds host paths. Your home directory is mounted by default in Pyxis (--no-container-mount-home disables that)."
  - "If plugstack.conf is correct on the login node but missing on a compute node, the job fails in slurmstepd on that node only. Check every node, or keep plugstack.conf in the shared Slurm config directory."
  - "A 'required' SPANK plugin whose .so is missing makes every srun fail. 'optional' tolerates its absence."
