# Private solution for scenario ins-storage-shared-mounts
solution:
  - sacct -j 4001 --format=JobID,JobName,State,ExitCode,NodeList,WorkDir%20
  - cat /home/alice/llm/llm-ft-4001.out
  - ssh dgx-02 df -h
  - ssh dgx-02 findmnt -t nfs,nfs4
  - ssh dgx-02 cat /etc/fstab
  - ssh dgx-02 journalctl -u cmd
  - showmount -e master
  - cmsh -c "category; use default; fsmounts; list"
  - cmsh -c "category; use dgx-h100; fsmounts; list"
  - cmsh -c "category; use dgx-h100; fsmounts; add /home; set device master:/home; set filesystem nfs; set mountoptions rsize=32768,wsize=32768,hard,async; use /cm/shared; set device master:/cm/shared; commit"
  - cmsh -c "category; use dgx-h100; fsmounts; list"
  - ssh dgx-02 df -h
  - ssh dgx-04 findmnt /home
  - su - alice -c "sbatch /home/alice/llm/train.sbatch"
  - squeue -u alice
  - cat /home/alice/llm/llm-ft-4002.out
explanation: |
  BCM mounts shared filesystems on nodes from the fsmounts of the node's
  category (plus device-level entries). CMDaemon writes them into an
  autogenerated section of /etc/fstab and mounts them. The default
  category has master:/home and master:/cm/shared ("master" is BCM's alias for
  the head node). The new dgx-h100 category was built by hand and got only one
  entry, with a typo:

  * /home was missing completely, so jobs that cd into a home directory fail
    ("couldn't chdir ... going to /tmp instead") and cannot read their files.
  * /cm/shared pointed at master:/cm/share, which the head node does not export.
    The mount is refused with "access denied by server", and showmount -e master
    shows the real export list.

  Fixing it in the category (fsmounts submode, commit) is the persistent fix.
  CMDaemon rewrites the fstab section on every node in the category and mounts
  the filesystems immediately, and every node provisioned later gets the same
  entries. Editing /etc/fstab or running mount by hand on four nodes works only
  until the next reprovision or until CMDaemon rewrites its section.

  The proof is end to end: df/findmnt on the nodes show both NFS mounts, and
  alice's job, submitted as alice, completes with its config file read from
  /home and the module tree listed from /cm/shared.
edge_cases:
  - "BCM uses the hostname 'master' for the active head node (it moves with HA failover), so prefer master:/path over a head node's own hostname or IP in fsmounts."
  - "An export path that doesn't exist on the server gives 'access denied by server while mounting', the same as a client that is not allowed by /etc/exports. Check showmount -e and exportfs -v on the server."
  - "After editing /etc/exports on the server, run exportfs -ra (or restart nfs-server). Until then, nfsd serves the old list."
  - "Slurm does not create or mount home directories. A missing working directory turns into 'couldn't chdir ... going to /tmp instead' in the job output. The job keeps running, so relative paths quietly fail."
  - "For real AI workloads, /home over NFS from the head node is for code and configs only. Datasets and checkpoints belong on a parallel filesystem (Lustre, GPFS, WekaFS, DDN) or local NVMe (/raid on DGX), mounted the same way through fsmounts or the vendor client."
  - "Mount options matter. 'hard' (the default) makes processes wait through a server outage instead of getting I/O errors. 'soft' can corrupt writes. nconnect=N and larger rsize/wsize help NFS throughput on fast networks."
