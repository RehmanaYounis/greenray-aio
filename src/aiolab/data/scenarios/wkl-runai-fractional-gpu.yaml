id: wkl-runai-fractional-gpu
title: Two notebooks on one GPU with Run:ai fractions
domain: Workload Management
difficulty: medium
time_limit_min: 15
tags: [kubernetes, runai, fractional-gpu, quota, workloads]
briefing: |
  Run:ai manages dgx-04 (8 H100s). alice@corp.ai works in project "nlp", which has a deserved
  quota of 1 GPU. Her small jobs need far less than a full H100. Her ticket:

    "I started two Jupyter workspaces, jlab-a and jlab-b, each with -g 1. jlab-a runs but
     jlab-b has been Pending for an hour. Each one needs at most ~30 GB of GPU memory.
     My batch embedding job embed-batch (0.5 GPU, training) runs fine, but the vision team
     says it's eating *their* quota."

  Get alice's work running within the rules:
    - jlab-a and jlab-b run at the same time, as interactive (non-preemptible) workloads in
      nlp, each with half a GPU, sharing one physical GPU.
    - embed-batch runs in nlp, not in vision. It may be preempted when others need their GPUs.
    - Don't touch vision's own training (detr-train).
  The notebooks keep their work on shared storage, so recreating them is fine. Use image
  nvcr.io/nvidia/pytorch:24.05-py3 for all of alice's workloads.
objectives:
  - jlab-a and jlab-b are Running in nlp as non-preemptible interactive workloads with 0.5 GPU each
  - jlab-a and jlab-b share one physical GPU
  - embed-batch (0.5 GPU, preemptible training) runs in nlp and no longer exists in vision
  - vision's detr-train is still Running
setup:
  - python: |
      from aiolab.commands import helm, kubectl as kc, runai as ra
      helm.preinstall(state, "nvidia/gpu-operator", values={"driver": {"enabled": False}}, settle=86400 * 3)
      ra.install(state, nodes=["dgx-04"])
      ra.create_department(state, "research", 8)
      ra.create_project(state, "nlp", "research", 1)
      ra.create_project(state, "vision", "research", 7)
      state.runai.users.extend(["alice@corp.ai", "bob@corp.ai"])
      state.runai.access_rules.extend([
          {"user": "alice@corp.ai", "role": "L1 researcher", "project": "nlp"},
          {"user": "alice@corp.ai", "role": "L1 researcher", "project": "vision"},
          {"user": "bob@corp.ai", "role": "L1 researcher", "project": "vision"},
      ])
      img = "nvcr.io/nvidia/pytorch:24.05-py3"
      ra.submit(state, "detr-train", "vision", img, 6, user="bob@corp.ai",
                command="torchrun --nproc_per_node=6 train_detr.py", created=kc.now(state))
      kc.reconcile(state)
      ra.submit(state, "jlab-a", "nlp", img, 1, wtype="Interactive", user="alice@corp.ai", created=kc.now(state) + 1)
      kc.reconcile(state)
      ra.submit(state, "embed-batch", "vision", img, 0.5, user="alice@corp.ai",
                command="python embed.py --shard all", created=kc.now(state) + 2)
      kc.reconcile(state)
      kc.advance(state, 300)
      ra.submit(state, "jlab-b", "nlp", img, 1, wtype="Interactive", user="alice@corp.ai")
      kc.reconcile(state)
      kc.advance(state, 3600)
      kc.reconcile(state)
checks:
  - desc: jlab-a and jlab-b are Running in nlp, interactive, non-preemptible, 0.5 GPU each
    expr: "all(any(w.name == n and w.project == 'nlp' and w.type == 'Interactive' and not w.preemptible and w.status == 'Running' and w.gpu == 0.5 for w in state.runai.workloads) for n in ('jlab-a', 'jlab-b'))"
  - desc: jlab-a and jlab-b share the same physical GPU
    expr: "len({(w.node, w.alloc[0][0]) for w in state.runai.workloads if w.project == 'nlp' and w.name in ('jlab-a', 'jlab-b') and w.status == 'Running' and w.alloc}) == 1"
  - desc: embed-batch is Running in nlp as preemptible training with 0.5 GPU
    expr: "any(w.name == 'embed-batch' and w.project == 'nlp' and w.type == 'Training' and w.preemptible and w.status == 'Running' and w.gpu == 0.5 for w in state.runai.workloads)"
  - desc: no embed-batch left in project vision
    expr: "not any(w.name == 'embed-batch' and w.project == 'vision' for w in state.runai.workloads)"
  - desc: detr-train is still Running in vision with 6 GPUs
    expr: "any(w.name == 'detr-train' and w.project == 'vision' and w.status == 'Running' and w.gpu == 6 for w in state.runai.workloads)"
  - desc: you checked why jlab-b was Pending
    expr: "ran(r'runai (describe (job|workload) jlab-b|(workspace|workload) describe jlab-b)') or ran(r'kubectl describe (pod|po|pods) .*jlab-b')"
hints:
  - "`runai describe job jlab-b -p nlp`: read the event. What is nlp's deserved quota, how much does it already use, and what kind of workload is jlab-b?"
  - "Interactive workloads are non-preemptible, so they may only use the project's deserved quota (1 GPU). Two notebooks with -g 1 can never both fit. With -g 0.5 they fit, and Run:ai packs both onto one physical GPU."
  - "A running workload's GPU request can't be changed. Delete it and submit again: `runai delete job jlab-a -p nlp`, then `runai submit jlab-a -i nvcr.io/nvidia/pytorch:24.05-py3 -g 0.5 --interactive -p nlp`. Delete both notebooks before resubmitting, or the old jlab-b grabs the freed quota."
  - "`runai list jobs -A` shows embed-batch in vision. Move it: delete it there and submit it to nlp as training with -g 0.5. It goes over nlp's quota, which is allowed because training is preemptible."
  - "Fractions are bin-packed onto GPUs that are already partly used, so order matters. Remove embed-batch from vision before resubmitting the notebooks, then check `runai list nodes` / `runai describe job jlab-a -p nlp` to confirm that both notebooks are on the same GPU index."
references:
  - NVIDIA Run:ai documentation - GPU fractions
  - NVIDIA Run:ai documentation - Quota, over-quota and preemptible workloads
  - NVIDIA Run:ai CLI reference - runai submit / runai workspace submit / runai training submit
