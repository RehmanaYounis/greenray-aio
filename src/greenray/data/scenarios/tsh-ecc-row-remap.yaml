id: tsh-ecc-row-remap
title: "Uncorrectable ECC on a DGX node - row remap pending"
domain: Troubleshooting and Optimization
difficulty: medium
time_limit_min: 15
tags: [ecc, row-remapping, xid, nvidia-smi, slurm, drain]
briefing: |
  Monitoring raised an alert overnight: "{node} GPU {gpu}: uncorrectable ECC error,
  row remapping pending". {user}'s 8-GPU training job {job} is still running on
  "{node}. It survived because her code checkpoints and retries, but the job log"
  shows a CUDA error and a restart from checkpoint.

  Confirm what the GPU reports. Get {node} healthy again without throwing away
  "{user}'s work (the job is requeue-safe: it restarts from its last checkpoint),"
  and put the node back into service.
objectives:
  - Confirm the row-remapper state of GPU {gpu} on {node}
  - Stop new jobs from landing on {node}, and move {user}'s job off it cleanly
  - Activate the pending row remap
  - "{node} back in service with no remap pending"
setup:
  - python: |
      n = state.nodes['{node}']
      g = n.gpus[{gpu}]
      g.remap_pending = True
      g.remapped_rows_uncorrectable = 1
      g.ecc_volatile_dbe = 1
      g.ecc_aggregate_dbe = 1
      g.xid = 63
      n.dmesg.extend([
          "[521004.118211] NVRM: Xid (PCI:0000:{busl}:00): 94, pid=93811, name=python, Contained: SM (0x1). RST: No, D-RST: No",
          "[521004.118502] NVRM: Xid (PCI:0000:{busl}:00): 63, pid='<unknown>', name=<unknown>, Row Remapper: New row (0x0000000000a1b2c0) was marked for remapping, reset gpu to activate.",
      ])
      st = state.slurm
      st.users['{user}'] = {'name': '{user}', 'default_account': 'root'}
      st.jobs.append({'id': {job}, 'name': '{jobname}', 'user': '{user}', 'partition': 'defq', 'state': 'RUNNING',
                      'num_nodes': 1, 'gpus_per_node': 8, 'ntasks_per_node': 8, 'nodelist': ['{node}'],
                      'alloc_gpus': {'{node}': list(range(8))}, 'start_time': 0, 'submit_time': 0,
                      'duration': None, 'command': '/home/{user}/{jobname}.sbatch'})
      for x in n.gpus:
          x.processes.append({'pid': 93800 + x.index, 'name': 'python train.py', 'used_mib': 64000,
                              'user': '{user}', 'slurm_job': {job}})
          x.memory_used_mib = 64000
          x.utilization = 97
      st.next_job_id = {job} + 1
checks:
  - desc: you checked the row remapper / ECC state on {node}
    expr: ran(r'nvidia-smi .*(ROW_REMAPPER|remapped_rows|-d ECC|-q)', '{node}') or ran(r'dcgmi (diag|health)', '{node}')
  - desc: "{node} was drained for the maintenance"
    expr: len(slurm.nodes['{node}'].get('drain_log', [])) > 0
  - desc: the node was drained before the GPU was reset or the node rebooted
    kind: safety
    expr: ran_before(r'(scontrol update .*state=drain|cmsh .*drain)', r'(nvidia-smi .*-r\b|^reboot|scontrol reboot)')
  - desc: nothing was rebooted, powered off or set DOWN with {user}'s job still on it
    kind: safety
    expr: not audit('reboot_with_jobs') and not audit('power_off_with_jobs') and not audit('node_down_with_jobs')
  - desc: GPU {gpu} has no pending row remap (remap activated by a GPU reset or reboot)
    expr: not nodes['{node}'].gpus[{gpu}].remap_pending and not nodes['{node}'].gpus[{gpu}].remap_failure
  - desc: "{user}'s job {job} was requeued (not simply killed)"
    expr: jobs(id={job})[0].get('restarts', 0) > 0 and jobs(id={job})[0].state in ('PENDING', 'RUNNING', 'COMPLETED')
  - desc: "{node} is back in service"
    expr: slurm.nodes['{node}'].state in ('IDLE', 'MIXED', 'ALLOCATED') and not slurm.nodes['{node}'].get('drain')
hints:
  - "On {node}: nvidia-smi -q -d ROW_REMAPPER (or --query-gpu=index,remapped_rows.pending,remapped_rows.failure --format=csv). Pending: Yes means the spare row is reserved but only takes effect after a GPU reset."
  - "A reset needs the GPU to be idle. Drain the node first so no new job lands on it: scontrol update nodename={node} state=drain reason=\"...\"."
  - "The job is requeue-safe. Requeueing job {job} with scontrol frees the node and the job restarts elsewhere from its checkpoint. scancel would throw the allocation away."
  - "Once the GPU is idle: reset GPU {gpu} on {node} with nvidia-smi (-r together with -i), check that Pending is No, then resume the node with scontrol update."
references:
  - NVIDIA GPU Memory Error Management (row remapping) documentation
  - NVIDIA GPU Xid Errors documentation (Xid 63, 64, 94, 95)
  - Slurm scontrol man page (requeue, update NodeName State=DRAIN)
variants:
  - {"node": "dgx-04", "gpu": 6, "busl": "ba", "job": 3101, "user": "alice", "jobname": "gpt-train"}
  - {"node": "dgx-01", "gpu": 2, "busl": "3a", "job": 2880, "user": "bob", "jobname": "resnet-train"}
  - {"node": "dgx-03", "gpu": 5, "busl": "ab", "job": 4012, "user": "carol", "jobname": "sd-finetune"}
