id: tsh-ib-port-down
title: One compute-fabric port on {node} is down
domain: Troubleshooting and Optimization
difficulty: medium
time_limit_min: 15
tags: [infiniband, ibstat, mlxlink, ibdiagnet, nccl]
briefing: |
  Multi-node jobs that include {node} are about 12% slower than jobs on any
  other pair of nodes. UFM raised a "port down" event on rail {rail} overnight, but
  nobody followed up.
  Find the faulty link, identify the cause from the evidence (port state,
  physical state, module/optical data), fix it, and prove that {node} runs
  at full fabric bandwidth again.
  Physical actions (reseating a cable or transceiver) are done with the lab
  helper `reseat-cable <node> <hca>`, which stands in for the data-center
  technician.
objectives:
  - All eight ConnectX-7 ports on {node} are Active / LinkUp at 400 Gb/s (NDR)
  - A two-node NCCL all_reduce including {node} reaches at least 350 GB/s busbw
setup:
  - merge: nodes.{node}.ib.{rail}
    value: {state: Down, phys_state: Polling, cable_ok: false, link_downed: 1}
checks:
  - desc: "{node} mlx5_{rail} is Active/LinkUp at 400 Gb/s"
    expr: (lambda p:p.state == 'Active' and p.phys_state == 'LinkUp' and p.rate_gbps == 400)(nodes['{node}'].ib[{rail}])
  - desc: all 8 compute-fabric ports on {node} are Active
    expr: all(p.state == 'Active' and p.phys_state == 'LinkUp' for p in nodes['{node}'].ib)
  - desc: you checked port state on {node} (ibstat / ibstatus / ibv_devinfo)
    expr: ran(r'^(ibstat|ibstatus|ibv_devinfo)', '{node}')
  - desc: you looked at link/module diagnostics with mlxlink
    expr: ran(r'^mlxlink .*-d', '{node}')
  - desc: a multi-node NCCL test including {node} reached >= 350 GB/s over IB
    expr: (lambda r:r.get('ok') and '{node}' in r.get('hosts', []) and len(r.get('hosts', [])) > 1 and r.get('transport') == 'IB' and r.get('busbw', 0) >= 350)(flags.get('nccl_last', {}))
hints:
  - "On {node}, `ibstat` (or `ibstatus`) lists all eight HCAs. Compare State, Physical state and Rate across them."
  - "State Down with Physical state Polling means the HCA is sending training signals but no link partner answers. That points to cable, transceiver or switch port, not to the Subnet Manager. (SM problems look like Initializing or Armed.)"
  - "mlxlink -d mlx5_{rail} -m shows the module data. What is the RX optical power on each lane?"
  - "Toggling the port in software (mlxlink --port_state TG) won't bring a link up when no light is received. The physical action here is to reseat the cable of port mlx5_{rail} on {node}; this lab has a reseat-cable command for it."
  - "Prove it with traffic: an NCCL all_reduce_perf across {peer} and {node} through mpirun (16 processes, 8 per host, one GPU each, 1G to 8G)."
references:
  - NVIDIA MLNX_OFED / DOCA infiniband-diags (ibstat, ibstatus, perfquery, ibdiagnet)
  - NVIDIA Firmware Tools (MFT) mlxlink user guide
  - NVIDIA DGX SuperPOD H100 reference architecture (rail-optimized compute fabric)
variants:
  - {"node": "dgx-03", "peer": "dgx-01", "rail": 3}
  - {"node": "dgx-01", "peer": "dgx-02", "rail": 6}
  - {"node": "dgx-04", "peer": "dgx-03", "rail": 0}
