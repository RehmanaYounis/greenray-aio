id: adm-bcm-grabimage-sync
title: A hand-fix on dgx-01 works. Make it permanent and roll it out
domain: Administration
difficulty: hard
time_limit_min: 20
tags: [bcm, cmsh, softwareimage, grabimage, imageupdate, provisioning]
briefing: |
  Multi-node NCCL jobs failed on every DGX node with
  "NCCL WARN Call to ibv_reg_mr failed ... Cannot allocate memory". During last
  night's incident (INC-4471) the on-call engineer fixed dgx-01 by hand. He
  raised the locked-memory limit in a new file under
  /etc/security/limits.d/ and installed `iperf3` for bandwidth tests. Jobs on
  dgx-01 now work. He did not touch the software image, so:

    * the next reprovision of dgx-01 would silently undo the fix, and
    * dgx-02..04 still fail.

  Capture what changed on dgx-01 into the `dgx-os-6.2-h100-image` software
  image, review the change before writing anything, and roll it out to the other
  DGX nodes without rebooting them. The engineer also left his personal SSH
  deploy key in /root/.ssh on dgx-01. It must never end up in the image that
  every node receives.
objectives:
  - The image contains the memlock limits file and iperf3
  - The engineer's private key is not in the image
  - dgx-01 keeps its fix, and dgx-02..04 receive it from the image (no reboots)
  - You reviewed a dry run before the real grab
setup:
  - python: |
      from greenray.commands.cmsh import DGX_PKGS
      head = state.nodes['bcm-head'].files
      base = '/cm/images/dgx-os-6.2-h100-image'
      d1 = state.nodes['dgx-01']
      # what every DGX node was provisioned with
      for p, c in d1.files.items():
          if p != '/etc/hostname':
              head[base + p] = c
      state.bcm.softwareimages['dgx-os-6.2-h100-image'].packages = dict(DGX_PKGS)
      for n in ('dgx-01', 'dgx-02', 'dgx-03', 'dgx-04'):
          state.nodes[n].packages = dict(DGX_PKGS)
      # the hand-fix on dgx-01
      d1.files['/etc/security/limits.d/99-memlock.conf'] = (
          "# INC-4471: RDMA/NCCL needs to pin GPU and host memory\n"
          "*    soft    memlock    unlimited\n"
          "*    hard    memlock    unlimited\n")
      d1.packages['iperf3'] = '3.9-1'
      d1.files['/root/.ssh/id_ed25519'] = (
          "-----BEGIN OPENSSH PRIVATE KEY-----\n"
          "b3BlbnNzaC1rZXktdjEAAAAABG5vbmUAAAAEbm9uZQAAAAAAAAABAAAAMwAAAAtzc2gtZW\n"
          "QyNTUxOQAAACB9kX2bq3oTq0ZrjJgM0sZf5k8w2gV5a3ePe4h1xJkqVQAAAJgA2Q3PANkN\n"
          "-----END OPENSSH PRIVATE KEY-----\n")
      d1.files['/root/.ssh/id_ed25519.pub'] = "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIH2Rfdeploy rkumar@laptop\n"
      d1.files['/tmp/nccl-debug.log'] = "NCCL INFO NET/IB : Using [0]mlx5_0:1/IB ...\n"
      for n in ('dgx-02', 'dgx-03', 'dgx-04'):
          state.nodes[n].journal['nccl-tests'] = [
              f"2026-10-19 02:11:07 {n} all_reduce_perf: NCCL WARN Call to ibv_reg_mr failed with error Cannot allocate memory",
              f"2026-10-19 02:11:07 {n} all_reduce_perf: NCCL WARN NET/IB : Unable to register memory (ulimit -l = 65536 KB)",
          ]
checks:
  - desc: the image contains the memlock limits file
    expr: re.search(r'memlock\s+unlimited', file('bcm-head', '/cm/images/dgx-os-6.2-h100-image/etc/security/limits.d/99-memlock.conf')) is not None
  - desc: the image contains iperf3
    expr: bcm.softwareimages['dgx-os-6.2-h100-image'].get('packages', {}).get('iperf3') == '3.9-1'
  - desc: the engineer's private SSH key is not in the image
    expr: not any(p.startswith('/cm/images/dgx-os-6.2-h100-image/root/.ssh/id_') for p in nodes['bcm-head'].files)
  - desc: dgx-01 still has its fix (limits file and iperf3)
    expr: "'memlock' in file('dgx-01', '/etc/security/limits.d/99-memlock.conf') and nodes['dgx-01'].get('packages', {}).get('iperf3') == '3.9-1'"
  - desc: dgx-02, dgx-03 and dgx-04 received the fix from the image
    expr: all('memlock' in file(n, '/etc/security/limits.d/99-memlock.conf') and nodes[n].get('packages', {}).get('iperf3') == '3.9-1' for n in ('dgx-02', 'dgx-03', 'dgx-04'))
  - desc: you ran a grabimage dry run as well as the real grab
    expr: len(bcm.get('grab_dryruns', [])) > 0 and len(bcm.get('grabs', [])) > 0
  - desc: no DGX node was rebooted and nothing is left uncommitted
    expr: all(d.get('reboots', 0) == 0 for k, d in bcm.devices.items() if k.startswith('dgx-')) and not bcm.uncommitted
hints:
  - "Two commands move files between a node and its image, in opposite directions. imageupdate pushes image -> node. grabimage pulls node -> image. Which one do you need first, and what would the other one do to dgx-01's fix?"
  - "In cmsh device mode, grabimage dgx-01 without -w is a dry run. synclog dgx-01 then lists every file and package that would change in the image. Read it carefully."
  - "Files matching the category's excludelistgrab are never copied into the image. Look at it with: cmsh -c \"category; use dgx-h100; get excludelistgrab\". You can add an entry with append excludelistgrab '- /root/.ssh/*' and commit. Removing the key from dgx-01 first works too."
  - "After grabimage -w dgx-01, verify the image (look under /cm/images/..., or chroot ... dpkg -l iperf3), then run imageupdate (dry run, synclog, then -w) for dgx-02..dgx-04."
references:
  - NVIDIA Base Command Manager 10 Administrator Manual (grabimage, imageupdate, exclude lists)
  - NCCL troubleshooting (memlock / ibv_reg_mr failures)
