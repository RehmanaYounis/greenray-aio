id: adm-k8s-mig-mixed-strategy
title: Expose MIG slices to Kubernetes with the mixed strategy
domain: Administration
difficulty: hard
time_limit_min: 20
tags: [kubernetes, mig, gpu-operator, mig-manager]
briefing: |
  The inference platform wants small, isolated GPU slices on Kubernetes. The plan:
    - dgx-04 becomes the "MIG node". Each of its 8 H100s is split into seven 1g.10gb
      instances, managed declaratively by the GPU Operator's MIG manager (no manual
      nvidia-smi on the node, because the layout must come back after reboots).
    - dgx-01..dgx-03 stay full-GPU nodes for training.
    - Pods must request slices by profile name, as nvidia.com/mig-1g.10gb, so that
      later the cluster can mix profiles (e.g. 3g.40gb) and users get exactly what they ask for.

  The GPU Operator is already installed (release "gpu-operator", namespace
  gpu-operator) with default MIG settings. A test pod from /root/mig-inference.yaml is
  Pending. Make the platform match the plan and get the test pod running on dgx-04.
  Keep the configuration in the Helm release so a future `helm upgrade` won't undo it.
objectives:
  - The GPU Operator runs with mig.strategy=mixed (in the Helm release and the ClusterPolicy)
  - dgx-04 carries nvidia.com/mig.config=all-1g.10gb and the MIG manager reports success
  - All 8 GPUs on dgx-04 have seven 1g.10gb GPU instances, each with a compute instance; dgx-01..03 have no MIG
  - dgx-04 advertises 56 nvidia.com/mig-1g.10gb
  - mig-inference is Running on dgx-04
setup:
  - python: |
      from greenray.commands import helm, kubectl as kc
      helm.preinstall(state, "nvidia/gpu-operator", values={"driver": {"enabled": False}}, settle=86400 * 3)
  - file: /root/mig-inference.yaml
    host: bcm-head
    content: |
      apiVersion: v1
      kind: Pod
      metadata:
        name: mig-inference
        labels:
          app: mig-inference
      spec:
        restartPolicy: Never
        containers:
        - name: triton
          image: nvcr.io/nvidia/tritonserver:24.05-py3
          args: ["tritonserver", "--model-repository=/models"]
          resources:
            limits:
              nvidia.com/mig-1g.10gb: 1
  - python: |
      from greenray.commands import kubectl as kc
      kc.apply_yaml(state, state.nodes["bcm-head"].files["/root/mig-inference.yaml"])
      kc.advance(state, 900)
      kc.reconcile(state)
checks:
  - desc: Helm release uses mig.strategy=mixed
    expr: "any(r.chart == 'gpu-operator' and r.computed.mig.strategy == 'mixed' for r in k8s.helm_releases)"
  - desc: ClusterPolicy uses mig.strategy=mixed
    expr: "k8s.clusterpolicy is not None and k8s.clusterpolicy.spec.mig.strategy == 'mixed'"
  - desc: dgx-04 labelled nvidia.com/mig.config=all-1g.10gb and state success
    expr: "k8s.nodes['dgx-04'].labels.get('nvidia.com/mig.config') == 'all-1g.10gb' and k8s.nodes['dgx-04'].labels.get('nvidia.com/mig.config.state') == 'success'"
  - desc: every dgx-04 GPU has 7 x 1g.10gb GPU instances with compute instances
    expr: "all(g.mig_mode and sorted(i.profile for i in g.gpu_instances) == ['1g.10gb'] * 7 and len({c.gi for c in g.compute_instances}) == 7 for g in nodes['dgx-04'].gpus)"
  - desc: dgx-01..dgx-03 are untouched (no MIG)
    expr: "not any(g.mig_mode or g.gpu_instances for n in ('dgx-01', 'dgx-02', 'dgx-03') for g in nodes[n].gpus)"
  - desc: dgx-04 advertises 56 nvidia.com/mig-1g.10gb
    expr: "k8s.nodes['dgx-04'].allocatable.get('nvidia.com/mig-1g.10gb') == '56'"
  - desc: mig-inference is Running on dgx-04
    expr: "any(p.name == 'mig-inference' and p.status == 'Running' and p.node == 'dgx-04' for p in pods('default'))"
hints:
  - "`kubectl describe pod mig-inference`: no node offers nvidia.com/mig-1g.10gb at all. Which resource names does the device plugin advertise today (`kubectl describe node dgx-04`)?"
  - "Resource names depend on the operator's mig.strategy. With 'single', MIG slices are still called nvidia.com/gpu; only 'mixed' advertises nvidia.com/mig-<profile>. Change it in the release: `helm upgrade ... --reuse-values --set mig.strategy=mixed`."
  - "The MIG manager watches the node label nvidia.com/mig.config. Look at the current value (`kubectl get node dgx-04 -L nvidia.com/mig.config`); changing an existing label needs --overwrite."
  - "After labelling, watch nvidia.com/mig.config.state go to success, then check that dgx-04 allocatable shows nvidia.com/mig-1g.10gb: 56."
references:
  - NVIDIA GPU Operator - GPU Operator with MIG
  - NVIDIA MIG User Guide - Supported profiles on H100
  - NVIDIA mig-parted
