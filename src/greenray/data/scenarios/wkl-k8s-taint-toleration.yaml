id: wkl-k8s-taint-toleration
title: GPU nodes are tainted - make the inference Deployment tolerate them
domain: Workload Management
difficulty: easy
time_limit_min: 12
tags: [kubernetes, taints, tolerations, deployment]
briefing: |
  Cluster policy: every DGX node carries the taint nvidia.com/gpu=present:NoSchedule,
  so CPU-only workloads never land on expensive GPU nodes. Only workloads that
  explicitly tolerate the taint may run there.

  The serving team deployed "triton-inference" (2 replicas, 1 GPU each) from
  /root/triton.yaml. Both replicas are Pending. They say they "already added a
  toleration".

  Get both replicas running on DGX nodes WITHOUT removing or changing the node taints.
  Fix the Deployment through its manifest (/root/triton.yaml), not individual pods.
objectives:
  - The nvidia.com/gpu=present:NoSchedule taint is still on dgx-01..dgx-04
  - The triton-inference pod template tolerates the taint
  - Both triton-inference replicas are Running on DGX nodes and none are left Pending
setup:
  - python: |
      from greenray.commands import helm, kubectl as kc
      helm.preinstall(state, "nvidia/gpu-operator", values={"driver": {"enabled": False}}, settle=86400 * 7)
      for n in ("dgx-01", "dgx-02", "dgx-03", "dgx-04"):
          state.k8s.nodes[n].taints.append({"key": "nvidia.com/gpu", "value": "present", "effect": "NoSchedule"})
      kc.reconcile(state)
  - file: /root/triton.yaml
    host: bcm-head
    content: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: triton-inference
        labels:
          app: triton-inference
      spec:
        replicas: 2
        selector:
          matchLabels:
            app: triton-inference
        template:
          metadata:
            labels:
              app: triton-inference
          spec:
            tolerations:
            - key: nvidia.com/gpu
              operator: Equal
              value: "true"
              effect: NoSchedule
            containers:
            - name: triton
              image: nvcr.io/nvidia/tritonserver:24.05-py3
              args: ["tritonserver", "--model-repository=/models"]
              resources:
                limits:
                  nvidia.com/gpu: 1
  - python: |
      from greenray.commands import kubectl as kc
      kc.apply_yaml(state, state.nodes["bcm-head"].files["/root/triton.yaml"])
      kc.advance(state, 1200)
      kc.reconcile(state)
checks:
  - desc: all four DGX nodes still have nvidia.com/gpu=present:NoSchedule
    expr: "all(any(t.key == 'nvidia.com/gpu' and t.get('value') == 'present' and t.effect == 'NoSchedule' for t in k8s.nodes[n].taints) for n in ('dgx-01', 'dgx-02', 'dgx-03', 'dgx-04'))"
  - desc: the Deployment's pod template tolerates nvidia.com/gpu=present:NoSchedule
    expr: "any(d.name == 'triton-inference' and any(t.get('key') == 'nvidia.com/gpu' and t.get('effect') in (None, '', 'NoSchedule') and (t.get('operator') == 'Exists' or str(t.get('value')) == 'present') for t in (d.template.spec.get('tolerations') or [])) for d in k8s.deployments)"
  - desc: /root/triton.yaml contains the fix
    expr: "'value: \"present\"' in file('bcm-head', '/root/triton.yaml') or 'value: present' in file('bcm-head', '/root/triton.yaml') or 'operator: Exists' in file('bcm-head', '/root/triton.yaml')"
  - desc: two triton-inference replicas Running on DGX nodes
    expr: "len([p for p in pods('default', 'triton-inference-') if p.status == 'Running' and (p.node or '').startswith('dgx-')]) == 2"
  - desc: no triton-inference pod left Pending
    expr: "not [p for p in pods('default', 'triton-inference-') if p.status == 'Pending']"
  - desc: you inspected the pod events or the node taints
    expr: "ran(r'kubectl describe (pod|pods|po|node|nodes|no)') or ran(r'kubectl get (events|ev)')"
hints:
  - "`kubectl describe pod -l app=triton-inference`: the FailedScheduling message names the exact taint the pods don't tolerate."
  - "Compare that taint with the toleration in /root/triton.yaml. With operator: Equal the key, value AND effect must all match."
  - "Either use the taint's real value ('present') or `operator: Exists` (which ignores the value). Then `kubectl apply -f /root/triton.yaml`. The Deployment rolls out new pods from the updated template."
references:
  - Kubernetes docs - Taints and Tolerations
  - NVIDIA GPU Operator - daemonsets.tolerations
