# Private solution for scenario tsh-first-look-at-logs
solution:
  - sacct -u {user}
  - sacct -j {job} --format=JobID,JobName,State,ExitCode,NodeList
  - ssh {node}
  - journalctl -u slurmd | grep {job}
  - dmesg | grep -i -B1 -A1 'out of memory'
  - exit
  - |
    cat > /root/ticket-{ticket}.txt <<EOF
    Job {job} ({jobname}) ended at 03:14 with state OUT_OF_MEMORY, exit code 0:125.
    Cause: the job used more RAM than it asked for. slurmstepd on {node} logged an oom_kill event in
    step {job}.batch and the kernel killed python (pid 48213) inside the job's memory cgroup.
    The node is fine. Resubmit with a larger --mem, or reduce the dataloader's memory footprint.
    EOF
  - cat /root/ticket-{ticket}.txt
explanation: |
  squeue only shows jobs that are pending or running, so the first stop for a job
  that "disappeared" is the accounting database: sacct keeps every job's final State
  and ExitCode. OUT_OF_MEMORY with exit code 0:125 is Slurm's own verdict: the job's
  memory cgroup hit its limit and the kernel OOM killer ended a task.

  The evidence behind that verdict lives on the node that ran the job. slurmstepd
  reports "Detected 1 oom_kill event in StepId={job}.batch", and the kernel ring
  buffer shows the oom-killer firing inside /slurm/uid_1002/job_{job} and killing
  python. The job's own output file says nothing because the process was killed,
  not asked to exit, which is why {user} saw no error.

  Writing the answer to the ticket is part of the job: the id, the state Slurm
  reports, and what to do next.
edge_cases:
  - "Slurm only enforces memory limits when cgroup.conf has ConstrainRAMSpace=yes (and JobAcctGatherType or TaskPlugin uses cgroups). Without it the kernel OOM killer still runs, but system-wide, and Slurm reports a plain FAILED."
  - "A node that really crashed shows the job as NODE_FAIL, and sinfo/scontrol show the node DOWN with a reason. OUT_OF_MEMORY means the node kept running."
  - "sacct output is truncated to column widths; use --format with a width (State%20) or -p for parsable output when a word is cut off, as with OUT_OF_ME+."
  - "journalctl -u slurmd on the node and journalctl -u slurmctld on the head node tell different halves of the story: the node knows why a step ended, the controller knows when the allocation was released."
  - "On a BCM cluster the GPU nodes may have small or no local journals (diskless or tmpfs /var/log). Then the detail is in the central syslog or in BCM's event log."
