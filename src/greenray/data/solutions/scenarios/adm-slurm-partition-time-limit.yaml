# Private solution for scenario adm-slurm-partition-time-limit
solution:
  - scontrol show partition defq
  - squeue
  - grep PartitionName /etc/slurm/slurm.conf
  - sed -i 's/MaxTime=INFINITE/MaxTime=2-00:00:00/' /etc/slurm/slurm.conf
  - grep PartitionName /etc/slurm/slurm.conf
  - scontrol reconfigure
  - scontrol show partition defq
  - squeue
explanation: |
  A partition's limits live on its PartitionName= line in slurm.conf, and the
  controller only reads that file at start-up or when told to. Editing the file
  changes nothing by itself: scontrol show partition keeps reporting the old
  MaxTime until slurmctld re-reads its configuration.

  scontrol reconfigure asks slurmctld (and through it every slurmd) to re-read
  slurm.conf. Running jobs are untouched, which is what the change request asked
  for. A restart of slurmctld would also work but is heavier than needed, and a
  restart of slurmd on the nodes is not required for a partition parameter.

  Time limits in Slurm use the days-hours:minutes:seconds form, so 2-00:00:00 is
  two days; 48:00:00 means the same thing.
edge_cases:
  - "Some slurm.conf changes cannot be applied with reconfigure and need a slurmctld restart; the man page marks them. Partition limits, node features and most scheduling parameters are safe to reconfigure."
  - "The new MaxTime applies to jobs submitted or started from now on. Jobs already running keep the limit they were started with. To shorten a running job use scontrol update jobid=N timelimit=..."
  - "scontrol update partitionname=defq maxtime=2-00:00:00 changes the running controller immediately, but the change is lost at the next restart unless slurm.conf is updated too. Do both when the change is meant to be permanent."
  - "On a BCM cluster slurm.conf is generated by cmd from the wlm configuration. Editing the file by hand is overwritten at the next cmd update; the durable change goes through cmsh (wlm; use slurm; ...) or the BCM-managed partition settings."
  - "A user who submits with --time longer than MaxTime gets 'Requested time limit is invalid (missing or exceeds some limit)' at submission, not a Pending job."
